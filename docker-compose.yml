services:
  # PostgreSQL Database
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: home-library-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-home_library}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rub54321}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
      - ./database/scripts:/docker-entrypoint-scripts.d
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - home-library-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-home_library}"]
      interval: 30s
      timeout: 10s
      retries: 5

  # NestJS Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: home-library-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-4000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-home_library}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rub54321}
      TEST_MODE: ${TEST_MODE:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-rub54321}@postgres:5432/${POSTGRES_DB:-home_library}
      # Authentication configuration
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-secret123123}
      JWT_SECRET_REFRESH_KEY: ${JWT_SECRET_REFRESH_KEY:-secret123123}
      TOKEN_EXPIRE_TIME: ${TOKEN_EXPIRE_TIME:-1h}
      TOKEN_REFRESH_EXPIRE_TIME: ${TOKEN_REFRESH_EXPIRE_TIME:-24h}
      CRYPT_SALT: ${CRYPT_SALT:-10}
      # Logging configuration
      LOG_LEVEL: ${LOG_LEVEL:-log}
      LOG_MAX_FILE_SIZE_KB: ${LOG_MAX_FILE_SIZE_KB:-1024}
    ports:
      - "${PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - home-library-network
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
  app_logs:
    driver: local

# Custom network for container communication
networks:
  home-library-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
